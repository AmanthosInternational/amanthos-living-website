       deshalb als Meta-Tag; damit steht auch Report-Only nicht zur Verfuegung.
       Erhoben am 28.08.2026 aus einem echten Seitenaufruf mit Zustimmung plus
       vollstaendiger Code-Suche, nicht von der Schwesterseite kopiert.
       frame-src td.doubleclick.net: Cookie-Abgleich der Google-Ads-Conversion. Sonst
       bettet die Seite nichts ein; Adyen laeuft ueber eine Weiterleitung
       (window.location.href in js/booking.js), nicht im iframe.
       Die Google-Ads-Domains sind am 29.08.2026 aus einem echten Conversion-Lauf
       erhoben, nicht aus der Doku geraten: googleadservices.com liefert das
       Conversion-Skript, googleads.g.doubleclick.net wird als Skript nachgeladen,
       pagead2.googlesyndication.com und ad.doubleclick.net nehmen die collect-Pings.
       Die Laenderdomains google.ch bis google.co.uk: gtag schickt den
       1p-conversion-Ping zusaetzlich an die Google-Domain des Besucherlandes. Fehlt
       eine, geht nur diese Kopie verloren; gezaehlt wird ueber googleadservices.com.
       fonts.googleapis.com und fonts.gstatic.com: nur fuer die CJK-Fassungen, die
       js/i18n.js nachlaedt. Ohne sie stehen ja, zh und ko ohne Schrift da. -->

      })();
